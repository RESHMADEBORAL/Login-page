<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flipkart Login</title>
    <link rel="stylesheet" href="flip.css">
</head>
<body>

<div class="login-container">

   
    <div class="left">
        <img src="logo8.png" alt="Flipkart Logo" class="logo">
        <p class="brand">Flipkart</p>
        <p class="tagline">Ab har wish hogi poori</p>
    </div>


    <div class="right">
        <h2>Login</h2>
        <p class="sub">Get access to your Orders, Wishlist and Recommendations</p>

        <div class="input-group">
            <label>Enter Email/Mobile number</label>
            <div class="input-wrapper">
                <input type="text" placeholder="+91 7706852050">
                <span class="input-icon">✉️</span>
            </div>
        </div>

        <div class="input-group">
            <div class="password-header">
                <label>Enter Password</label>
                <a href="#" class="forgot">Forgot?</a>
            </div>
            <div class="input-wrapper">
                <input type="password" placeholder="••••••••••••••">
                <span class="input-icon">🔒</span>
            </div>
        </div>

        <div class="buttons">
            <button class="login-btn">Login</button>
            <button class="signup-btn">Sign up</button>
        </div>

        <p class="social-notice">We no longer support login via Social accounts. To recover your old accounts <a href="#">please click here</a></p>
    </div>

</div>

</body>
</html>
